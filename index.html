const field=(name,label,value='',type='text',opts='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${opts}></label>`;const select=(name,label,choices,value)=>`<label class="field">${label}<select name="${name}">${choices.map(c=>{let [v,t]=Array.isArray(c)?c:[c,c];return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;const area=(name,label,value='',rows=5)=>`<label class="field full">${label}<textarea name="${name}" rows="${rows}">${esc(value)}</textarea></label>`;const subjectField=(value)=>select('subject','Дисциплина',availableSubjects().length?availableSubjects():[['','Сначала добавьте расписание']],value||availableSubjects()[0]||'');function modal(title,body,onSubmit){$('#modal').innerHTML=`<h2>${esc(title)}</h2><form id="modalForm"><div class="formgrid">${body}</div><div class="modalfooter"><button type="button" id="cancelModal">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form>`;$('#modalwrap').classList.add('open');$('#cancelModal').onclick=closeModal;$('#modalForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.currentTarget).entries());try{if(onSubmit(data)!==false){closeModal();render();notify('Сохранено')}}catch(err){alert('Ошибка: '+err.message)}}}function closeModal(){if(activeQuickHotkeys){document.removeEventListener('keydown',activeQuickHotkeys);activeQuickHotkeys=null}$('#modalwrap').classList.remove('open');$('#modal').innerHTML=''}function view(title,body){$('#modal').innerHTML=`<div class="cardhead"><h2>${esc(title)}</h2><button id="closeView">✕</button></div>${body}`;$('#modalwrap').classList.add('open');$('#closeView').onclick=closeModal}function upsert(type,id,data){let row=byId(type,id);if(row)Object.assign(row,data);else db[type].push({id:uid(),...data});return save()};const askDelete=(type,id)=>{if(!confirm('Удалить запись? Отменить действие нельзя.'))return;db[type]=db[type].fi // КН-02: безопасная SVG-диаграмма без внешних библиотек и без выполнения кода из импорта.
function snDiagramSvg(d){
 if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!d.nodes.length||d.nodes.length>35||d.edges.length>60)throw Error('Некорректная схема');
 const ids=new Set(),nodes=d.nodes.map(n=>{if(!n||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]{1,30}$/.test(n.id)||ids.has(n.id)||typeof n.label!=='string'||!n.label.trim()||n.label.length>160)throw Error('Некорректный узел');ids.add(n.id);return {id:n.id,label:n.label.trim()}});
 const edges=d.edges.map(e=>{if(!e||!ids.has(e.from)||!ids.has(e.to))throw Error('Некорректная связь');return e});
 const type=({hierarchy:'hierarchy',tree:'hierarchy',flow:'flow',sequence:'flow',comparison:'comparison',compare:'comparison',cause:'cause',causal:'cause'})[String(d.type||'hierarchy').toLowerCase()]||'hierarchy';
 const mobile=window.matchMedia('(max-width:650px)').matches;
 const byId=new Map(nodes.map(n=>[n.id,n]));const indeg=new Map(nodes.map(n=>[n.id,0]));edges.forEach(e=>indeg.set(e.to,indeg.get(e.to)+1));
 const levels=new Map(nodes.map(n=>[n.id,0]));const q=nodes.filter(n=>!indeg.get(n.id)).map(n=>n.id);let seen=0;
 while(q.length){const id=q.shift();seen++;for(const e of edges){if(e.from!==id)continue;levels.set(e.to,Math.max(levels.get(e.to),levels.get(id)+1));indeg.set(e.to,indeg.get(e.to)-1);if(!indeg.get(e.to))q.push(e.to)}}
 if(seen!==nodes.length)nodes.forEach((n,i)=>levels.set(n.id,i));
 const groups=new Map();nodes.forEach(n=>{const layer=(type==='flow'||type==='cause')?levels.get(n.id):(type==='comparison'?0:levels.get(n.id));if(!groups.has(layer))groups.set(layer,[]);groups.get(layer).push(n)});
 const rows=[];const perRow=mobile?1:(type==='comparison'?3:type==='flow'?2:3);
 [...groups.entries()].sort((a,b)=>a[0]-b[0]).forEach(([layer,arr])=>{for(let i=0;i<arr.length;i+=perRow)rows.push(arr.slice(i,i+perRow))});
 const boxW=mobile?268:210,boxH=mobile?92:94,stepX=mobile?284:230,stepY=mobile?138:156;
 const w=mobile?300:Math.max(350,Math.max(...rows.map(r=>r.length))*stepX+24),h=Math.max(145,rows.length*stepY+22);
 const coords=new Map();rows.forEach((arr,row)=>{const rowWidth=arr.length*stepX;arr.forEach((n,i)=>coords.set(n.id,{x:(w-rowWidth)/2+i*stepX+11,y:row*stepY+14}))});
 function splitLabel(label){const result=[];let current='';const limit=mobile?30:23;for(const word of label.split(/\s+/)){if(word.length>limit){if(current){result.push(current);current=''}for(let i=0;i<word.length;i+=limit)result.push(word.slice(i,i+limit));continue}if((current+' '+word).trim().length>limit&&current){result.push(current);current=word}else current=(current+' '+word).trim()}if(current)result.push(current);return result.slice(0,5)}
 const marker='sn-arrow-'+Math.random().toString(36).slice(2,9);
 const paths=edges.map(e=>{const a=coords.get(e.from),b=coords.get(e.to);const sx=a.x+boxW/2,sy=a.y+boxH,tx=b.x+boxW/2,ty=b.y;let path;if(ty>sy+5){const mid=(sy+ty)/2;path='M '+sx+' '+sy+' C '+sx+' '+mid+', '+tx+' '+mid+', '+tx+' '+ty}else{const startX=a.x+boxW,endX=b.x;path='M '+startX+' '+(a.y+boxH/2)+' C '+(startX+30)+' '+(a.y+boxH/2)+', '+(endX-30)+' '+(b.y+boxH/2)+', '+endX+' '+(b.y+boxH/2)}return '<path d="'+path+'" fill="none" stroke="#b75a5e" stroke-width="2" marker-end="url(#'+marker+')" opacity=".9"/>'}).join('');
 const blocks=nodes.map(n=>{const c=coords.get(n.id),lines=splitLabel(n.label),root=edges.every(e=>e.to!==n.id),fill=root?'#9d2939':(type==='comparison'?'#f2f5fa':type==='cause'?'#fff6ed':'#fff7f7'),ink=root?'#fff':'#29262a';const lineHeight=16,first=boxH/2-(lines.length-1)*lineHeight/2+5;const spans=lines.map((line,i)=>'<tspan x="'+(boxW/2)+'" y="'+(first+i*lineHeight)+'">'+esc(line)+'</tspan>').join('');return '<g transform="translate('+c.x+' '+c.y+')"><rect width="'+boxW+'" height="'+boxH+'" rx="12" fill="'+fill+'" stroke="#b75a5e" stroke-width="1.5"/><text x="'+(boxW/2)+'" y="'+first+'" font-family="Arial,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="'+ink+'">'+spans+'</text></g>'}).join('');

}

// Безопасное форматирование простого Markdown в конспектах.
function noteMarkup(raw){
 const lines=String(raw||'').split(/\r?\n/);const out=[];let sectionOpen=false;
 const startSection=()=>{if(sectionOpen)out.push('</section>');out.push('<section class="sn-note-section">');sectionOpen=true};
 const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(line.trim()==='```secretary-diagram'){
   const json=lines[++i]||'';if(lines[i+1]?.trim()==='```')i++;
   try{const d=JSON.parse(json);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges)||d.nodes.length>35)throw Error();out.push(snDiagramSvg(d))}catch{out.push('<p class="hint">Не удалось отобразить схему.</p>')}continue;
  }
  if(/^\|/.test(line)&&i+1<lines.length&&/^\|[\s|:-]+\|\s*$/.test(lines[i+1])){
   const parse=x=>x.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(t=>t.trim().replace(/\\\|/g,'|'));
   const head=parse(line);i+=2;const body=[];while(i<lines.length&&/^\|/.test(lines[i])&&body.length<100){body.push(parse(lines[i]));i++}i--;
   out.push('<div class="sn-table-wrap"><table class="sn-table"><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+head.map((_,j)=>'<td>'+inline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;
  }
  if(/^> \[(ОПРЕДЕЛЕНИЕ|ВАЖНО|ПРИМЕР|ВЫВОД)\]/.test(line)){const m=line.match(/^> \[([^\]]+)\]\s*(.*)$/);out.push('<div class="sn-callout"><strong>'+esc(m[1])+'</strong><p>'+inline(m[2])+'</p></div>');continue}
  if(/^###\s/.test(line)){startSection();out.push('<h4>'+inline(line.slice(4))+'</h4>');continue}
  if(/^##\s/.test(line)){startSection();out.push('<h3>'+inline(line.slice(3))+'</h3>');continue}
  if(/^#\s/.test(line)){startSection();out.push('<h2>'+inline(line.slice(2))+'</h2>');continue}
  if(/^[-*]\s/.test(line)){out.push('<p class="note-bullet">• '+inline(line.slice(2))+'</p>');continue}
  if(/^\d+\.\s/.test(line)){out.push('<p class="note-bullet">'+inline(line)+'</p>');continue}
  if(!line.trim())continue; // Пустые разделители JSON не превращаем в огромные пробелы.
  out.push('<p>'+inline(line)+'</p>');
 }
 if(sectionOpen)out.push('</section>');
 return sectionOpen?out.join(''):'<section class="sn-note-section">'+out.join('')+'</section>';
}

function journalAbbreviations(subjects){

 const skip=new Set(['и','в','во','на','по','для','с','со','рф','основы','основ']);
 const base=x=>{
  let w=words(x),use=w.filter(z=>!skip.has(z.toLowerCase()));
  let a=use.map(z=>z[0]?.toUpperCase()).join('');
  if(a.length<2)a=w.map(z=>z.slice(0,3)).join('');

 const out=new Map(),used=new Set();
 for(const x of subjects){let a=base(x),candidate=a,n=2;while(used.has(candidate)){candidate=a+'·'+n++}out.set(x,candidate);used.add(candidate)}

// v2.6 — independent history entry and safe JSON import: no replacement of the current database.
const SJ_FORMAT='secretary-journal-import';
const SJ_STATUSES=['Не отмечено','Присутствовал','Пропуск','Уважительная причина','Опоздание'];
const sjIso=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d||''))&&!Number.isNaN(+new Date(d+'T12:00:00'))&&new Date(d+'T12:00:00').toLocaleDateString('sv-SE')===d;

function sjValidate(r,i){
 if(!r||typeof r!=='object'||Array.isArray(r))throw Error('Запись №'+(i+1)+': неверный объект');
 const subject=String(r.subject||'').trim(),date=String(r.date||'').trim(),status=String(r.status||'Не отмечено').trim();
 if(!subject||subject.length>160)throw Error('Запись №'+(i+1)+': укажи предмет');
 if(!sjIso(date))throw Error('Запись №'+(i+1)+': нужна настоящая дата ГГГГ-ММ-ДД');
 if(!SJ_STATUSES.includes(status))throw Error('Запись №'+(i+1)+': неизвестный статус посещаемости');
 const grades=sjGrades(r.grades);if(grades&&!/^[1-5](\s*[,; ]\s*[1-5])*$/.test(grades))throw Error('Запись №'+(i+1)+': оценки только 1–5');
 const time=String(r.time||'').trim();if(time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('Запись №'+(i+1)+': неверное время');
 const reason=String(r.reason||'').slice(0,1200),hours=Number(r.hours??(status==='Пропуск'||status==='Уважительная причина'?Number(db.settings.lessonHours)||2:0));
 if(!Number.isFinite(hours)||hours<0||hours>16)throw Error('Запись №'+(i+1)+': часы должны быть от 0 до 16');
 return {subject,date,status:grades?'Присутствовал':status,grades:grades.replace(/\s*[,; ]\s*/g,', '),time,reason,hours:grades?0:['Пропуск','Уважительная причина'].includes(status)?hours:0};
}
function sjExistingKey(r){return r.subject.trim().toLocaleLowerCase('ru')+'|'+r.date+'|'+String(r.time||'')}
function sjImportPlan(rows){
 const existing=new Set(db.attendance.map(sjExistingKey)),seen=new Set(),plan=[];
 rows.forEach((r,i)=>{const record=sjValidate(r,i),key=sjExistingKey(record),duplicate=existing.has(key)||seen.has(key);seen.add(key);plan.push({record,duplicate})});return plan;
}

 const records=plan.filter(x=>!x.duplicate).map(x=>({id:uid(),lessonId:'import~'+uid(),...x.record}));
 if(!records.length){notify('Новых записей нет');return false}
 const original=db.attendance;db.attendance=original.concat(records);
 if(!save()){db.attendance=original;return false}
 closeModal();render();notify('Добавлено '+records.length+' записей. Дубликаты пропущены');return true;
}

function snV2Text(blocks){
 if(!Array.isArray(blocks)||blocks.length>400)throw Error('В каждом уровне допускается не более 400 блоков');
 const clean=(x,max=120000)=>{if(typeof x!=='string'||x.length>max)throw Error('Неверный тип или размер текста блока');return x.trim()};
 return blocks.map((b,i)=>{
  if(!b||typeof b!=='object'||Array.isArray(b))throw Error('Некорректный блок '+(i+1));
  const type=b.type;
  if(type==='heading'){const level=Number(b.level||2);if(![1,2,3].includes(level))throw Error('Неверный уровень заголовка');return '#'.repeat(level)+' '+clean(b.text,1000)}
  if(type==='paragraph')return clean(b.text);
  if(type==='definition'||type==='important'||type==='example'||type==='summary')return '> ['+({definition:'ОПРЕДЕЛЕНИЕ',important:'ВАЖНО',example:'ПРИМЕР',summary:'ВЫВОД'}[type])+'] '+clean(b.text);
  if(type==='list'){if(!Array.isArray(b.items)||b.items.length>150)throw Error('Неверный список');return b.items.map((x,j)=>(b.ordered?(j+1)+'. ':'- ')+clean(x,2000)).join('\n')}
  if(type==='table'){if(!Array.isArray(b.headers)||!b.headers.length||b.headers.length>12||!Array.isArray(b.rows)||b.rows.length>100)throw Error('Неверная таблица');const cells=r=>r.map(x=>clean(x,2000).replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ');if(b.rows.some(r=>!Array.isArray(r)||r.length!==b.headers.length))throw Error('Неверное число ячеек таблицы');return '| '+cells(b.headers)+' |\n| '+b.headers.map(()=>'---').join(' | ')+' |\n'+b.rows.map(r=>'| '+cells(r)+' |').join('\n')}
  if(type==='diagram'){if(!Array.isArray(b.nodes)||b.nodes.length<1||b.nodes.length>35||!Array.isArray(b.edges)||b.edges.length>60)throw Error('Неверная схема');const ids=new Set();for(const n of b.nodes){if(!n||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]{1,30}$/.test(n.id)||ids.has(n.id))throw Error('Повторный или неверный ID узла');ids.add(n.id);clean(n.label,160)}for(const e of b.edges){if(!e||!ids.has(e.from)||!ids.has(e.to))throw Error('Связь указывает на отсутствующий узел')}return '```secretary-diagram\n'+JSON.stringify({type:['hierarchy','tree','flow','sequence','comparison','compare','cause','causal'].includes(b.type)?b.type:'hierarchy',title:clean(b.title||'',150),nodes:b.nodes.map(n=>({id:n.id,label:n.label.trim()})),edges:b.edges.map(e=>({from:e.from,to:e.to}))})+'\n```'}
  throw Error('Неизвестный тип блока: '+String(type));
 }).join('\n\n');
}

  const key=String($('cloudKey')?.value||config.key||'').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))throw Error('Введите адрес проекта вида https://xxxxx.supabase.co');
  if(!key||key.toLowerCase().includes('service_role')||key.startsWith('sb_secret_'))throw Error('Используйте только publishable / anon key. Секретный ключ запрещён.');
  config={url,key};localStorage.setItem(CFG,JSON.stringify(config));return config;
 };
 const json=async(response)=>{let body;try{body=await response.json()}catch{body={}}if(!response.ok)throw Error(body.msg||body.message||body.error_description||body.error||`Ошибка HTTP ${response.status}`);return body};
 const authHeaders=(token)=>({'apikey':config.key,'Authorization':'Bearer '+token,'Content-Type':'application/json'});
 async function token(){if(!session?.access_token)throw Error('Сначала войдите в аккаунт.');
  if(Date.now()<(session.expires_at||0)-60000)return session.access_token;
  if(!session.refresh_token)throw Error('Сеанс истёк. Войдите снова.');
  const r=await json(await fetch(config.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})}));
  session={...r,expires_at:Date.now()+(r.expires_in||3600)*1000};sessionStorage.setItem(SESSION,JSON.stringify(session));return session.access_token;
 }
 async function auth(signup){validConfig();const email=$('cloudEmail')?.value.trim(),password=$('cloudPassword')?.value;
  if(!email||!password)throw Error('Укажите email и пароль.');
  const path=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const r=await json(await fetch(config.url+path,{method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})}));
  if(!r.access_token){status('Регистрация отправлена. Подтвердите email, затем нажмите «Войти».');return}
  session={...r,expires_at:Date.now()+(r.expires_in||3600)*1000};sessionStorage.setItem(SESSION,JSON.stringify(session));$('cloudPassword').value='';status('Вход выполнен: '+(r.user?.email||email));const title=$('cloudAccountTitle'),sub=$('cloudAccountSub');if(title)title.textContent='Аккаунт подключён';if(sub)sub.textContent=r.user?.email||email;
 }
 function currentData(allowMissing=false){const raw=localStorage.getItem(DATA_KEY);if(!raw){if(allowMissing)return null;throw Error('Локальные данные не найдены.');}const data=JSON.parse(raw);if(!data||data.version!==1||!Array.isArray(data.subjects)||!Array.isArray(data.attendance))throw Error('Неверный формат локальных данных.');return data}
 const BASELINE='secretary-cloud-baseline-v2';
 const baseKey=uid=>BASELINE+':'+config.url+':'+uid;
 const getBaseline=uid=>{try{return JSON.parse(localStorage.getItem(baseKey(uid))||'null')}catch{return null}};
 const setBaseline=(uid,data,stamp)=>localStorage.setItem(baseKey(uid),JSON.stringify({stamp,signature:JSON.stringify(data)}));
 const validData=d=>!!(d&&d.version===1&&Array.isArray(d.subjects)&&Array.isArray(d.schedule)&&Array.isArray(d.notes)&&Array.isArray(d.tasks)&&Array.isArray(d.attendance)&&d.settings&&typeof d.settings==='object');
 const getCloud=async(t,uid)=>{const rows=await json(await fetch(config.url+'/rest/v1/secretary_backups?user_id=eq.'+encodeURIComponent(uid)+'&select=payload,updated_at&limit=1',{headers:authHeaders(t),cache:'no-store'}));return Array.isArray(rows)&&rows.length?rows[0]:null};
 const saveFile=(data,name)=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)};
 const safeName=()=>new Date().toISOString().replace(/[:.]/g,'-');
 async function upload(){validConfig();const t=await token(),data=currentData(),uid=session.user?.id;if(!uid)throw Error('Не удалось определить пользователя.');
  const remote=await getCloud(t,uid),baseline=getBaseline(uid);
  if(remote){
   if(!baseline||baseline.stamp!==remote.updated_at){
    if(JSON.stringify(remote.payload)===JSON.stringify(data)){setBaseline(uid,data,remote.updated_at);status('Локальная и облачная копии совпадают. Версия подтверждена.');return}
    if(!confirm('ВНИМАНИЕ: облачная копия изменилась или ещё не была сверена с этим устройством.\n\nЕсли продолжить, текущая облачная версия останется в истории, а новая заменит её.\n\nПеред продолжением рекомендуется экспортировать локальный JSON и проверить облачную копию. Продолжить?'))return;
   }
  }
  if(!confirm('Создать новую облачную версию? Предыдущая сохранится в истории (до 10 версий).'))return;
  const result=await json(await fetch(config.url+'/rest/v1/rpc/secretary_safe_backup',{method:'POST',headers:authHeaders(t),body:JSON.stringify({p_payload:data,p_expected_updated_at:remote?.updated_at||null})}));
  const stamp=typeof result==='string'?result:result?.updated_at||result;
  if(!stamp||Number.isNaN(Date.parse(stamp)))throw Error('Сервер не вернул корректную дату сохранения. Проверьте историю перед повторной отправкой.');
  setBaseline(uid,data,stamp);status('Создана облачная версия: '+new Date(stamp).toLocaleString('ru-RU'));
 }
 async function download(){validConfig();const t=await token(),uid=session.user?.id;if(!uid)throw Error('Не удалось определить пользователя.');
  const remote=await getCloud(t,uid);if(!remote)throw Error('В облаке пока нет резервной копии.');
  if(!validData(remote.payload))throw Error('Облачная копия повреждена или несовместима.');
  const local=currentData(true);
  if(local&&JSON.stringify(local)===JSON.stringify(remote.payload)){setBaseline(uid,local,remote.updated_at);status('Локальная и облачная копии совпадают. Версия подтверждена.');return}
  if(!confirm('Облачная версия: '+new Date(remote.updated_at).toLocaleString('ru-RU')+'.\n\n'+(local?'Локальные данные будут заменены. Перед заменой браузер скачает JSON с текущими данными.':'На этом устройстве локальных данных нет. Облачная копия будет установлена как основная.')+' Продолжить?'))return;
  if(local)saveFile(local,'Secretary_before_cloud_restore_'+safeName()+'.json');
  const old=localStorage.getItem(DATA_KEY);try{localStorage.setItem(DATA_KEY,JSON.stringify(remote.payload))}catch(e){try{if(old!==null)localStorage.setItem(DATA_KEY,old)}catch{}throw e}
  setBaseline(uid,remote.payload,remote.updated_at);alert('Копия восстановлена. Проверьте скачанный файл с предыдущими локальными данными. Приложение перезагрузится.');location.reload();
 }
 async function history(){validConfig();const t=await token(),uid=session.user?.id;if(!uid)throw Error('Не удалось определить пользователя.');
  const rows=await json(await fetch(config.url+'/rest/v1/secretary_backup_history?user_id=eq.'+encodeURIComponent(uid)+'&select=id,created_at&order=created_at.desc&limit=10',{headers:authHeaders(t)}));
  if(!rows.length){status('История пока пуста. Новые сохранения будут добавляться в неё.');return}
  const choices=rows.map((r,i)=>(i+1)+'. '+new Date(r.created_at).toLocaleString('ru-RU')).join('\n');
  const choice=prompt('История облачных версий:\n'+choices+'\n\nВведите номер версии для восстановления (или отмените):');if(choice===null)return;
  const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=rows.length)throw Error('Неверный номер версии.');
  const item=await json(await fetch(config.url+'/rest/v1/secretary_backup_history?id=eq.'+encodeURIComponent(rows[index].id)+'&select=payload,created_at&limit=1',{headers:authHeaders(t)}));
  const data=item?.[0]?.payload;if(!validData(data))throw Error('Выбранная версия повреждена.');
  if(!confirm('Восстановить историческую версию от '+new Date(rows[index].created_at).toLocaleString('ru-RU')+'? Если локальные данные есть, они будут выгружены в JSON.'))return;
  const local=currentData(true);if(local)saveFile(local,'Secretary_before_history_restore_'+safeName()+'.json');
  const old=localStorage.getItem(DATA_KEY);try{localStorage.setItem(DATA_KEY,JSON.stringify(data))}catch(e){try{if(old!==null)localStorage.setItem(DATA_KEY,old)}catch{}throw e}
  // Историческая версия не является актуальной облачной: запрещаем слепую загрузку поверх неё.
  localStorage.removeItem(baseKey(uid));alert('Историческая версия восстановлена локально. Для дальнейшей синхронизации сначала сверьте актуальную облачную копию.');location.reload();
 }
 async function handle(id){if(busy)return;setBusy(true);status('Подождите…');try{
  if(id==='cloudSaveConfig'){validConfig();status('Подключение сохранено в этом браузере.')}
  if(id==='cloudConnect')await auth(false);
  if(id==='cloudSignup')await auth(true);
  if(id==='cloudUpload')await upload();
  if(id==='cloudDownload')await download();
  if(id==='cloudHistory')await history();
  if(id==='cloudLogout'){session=null;sessionStorage.removeItem(SESSION);status('Вы вышли из облачного аккаунта. Локальные данные сохранены.');const title=$('cloudAccountTitle'),sub=$('cloudAccountSub');if(title)title.textContent='Гостевой режим';if(sub)sub.textContent='Вы пока не вошли в облачный аккаунт.';}
 }catch(e){status('Ошибка: '+e.message,true)}finally{setBusy(false)}}
 document.addEventListener('click',e=>{const b=e.target.closest('#cloudConnect,#cloudSignup,#cloudUpload,#cloudDownload,#cloudHistory,#cloudLogout,#cloudSaveConfig');if(b){e.preventDefault();handle(b.id)}});
 const init=()=>{const target=$('content');if(!target)return;const refresh=()=>{
  const url=$('cloudUrl'),key=$('cloudKey');
  if(url&&!url.dataset.initialized){url.value=config.url||'';if(key)key.value=config.key||'';url.dataset.initialized='1';}
  const email=$('cloudEmail');if(email&&!email.dataset.initialized){email.value=session?.user?.email||'';email.dataset.initialized='1';}
  const title=$('cloudAccountTitle'),sub=$('cloudAccountSub');
  if(title)title.textContent=session?.access_token?'Аккаунт подключён':'Гостевой режим';
  if(sub)sub.textContent=session?.user?.email||'Вы пока не вошли в облачный аккаунт.';
  const sync=$('cloudSyncAccount');if(sync)sync.textContent=session?.user?.email?'Аккаунт: '+session.user.email:'Сначала войдите во вкладке «Профиль».';
  const statusEl=$('cloudStatus');if(statusEl&&!statusEl.dataset.initialized){statusEl.textContent=session?.user?.email?'Аккаунт: '+session.user.email:'Облако не подключено.';statusEl.dataset.initialized='1';}
 };new MutationObserver(refresh).observe(target,{childList:true});refresh()};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body></html>
